<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Home | Axel Sanchez Moreno</title>
    <link rel="stylesheet" href="css-folder/index.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            line-height: 1.5;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem 1.25rem;
            padding: 1rem;
        }

        nav a {
            padding: 0.35rem 0.25rem;
            white-space: nowrap;
        }

        main {
            width: min(100% - 2rem, 1100px);
            margin: 0 auto;
        }

        .box-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: clamp(1.5rem, 5vw, 4rem);
            text-align: center;
        }

        .centered-box { flex: 1 1 20rem; }
        .portrait-box { flex: 0 1 275px; }

        .portrait-box img {
            display: block;
            width: min(275px, 100%);
            height: auto !important;
            aspect-ratio: 1;
            object-fit: cover;
            margin: 0 auto;
        }

        .links-box {
            margin-top: 2.5rem;
            text-align: center;
        }

        .links-box h3 { margin-bottom: 0.75rem; }
        .links-box a { margin: 0.25rem 0.5rem; }
        .footer-box { text-align: center; }

        @media (max-width: 480px) {
            nav { gap: 0.25rem 0.75rem; }
            main { width: min(100% - 1.25rem, 1100px); }
            main[style] { padding-top: 2rem !important; }
            .centered-box h1 { font-size: clamp(1.7rem, 8vw, 2.25rem); }
            .footer-box {
                margin-top: 3rem !important;
                padding: 1rem !important;
            }
        }
    </style>
</head>
<body>

<nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="teaching.html">Teaching</a>
    <a href="research.html">Research</a>
    <a href="presentations.html">Presentations</a>
    <a href="cv.html">CV</a>
    <a href="contact.html">Contact</a>
</nav>

<main style="padding-top: 5em;">
    <div class="box-container">
        <div class="centered-box">
            <h1>Welcome to my Webpage!</h1>
            <p>Explore my teaching, research, presentations, CV, and contact information.</p>
        </div>

        <div class="portrait-box">
            <img src="image-folder/homepage-pic.jpg" alt="Axel Sanchez Moreno" style="width: 275px; height: 275px;">
        </div>
    </div>    

    <div class="links-box">
        <h3> Personal Links: </h3>
        <a href="https://github.com/axelsanchezmoreno" target="_blank" rel="noopener noreferrer" aria-label="GitHub" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.35em; font-size: 0.9em;">
            <img src="image-folder/github-logo.png" alt="" width="20" height="20">
            GitHub
        </a>
        <a href="https://www.linkedin.com/in/axel-sanchez-moreno/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.35em; font-size: 0.9em;">
            <img src="image-folder/linkin-logo.jpg" alt="" width="20" height="20">
            LinkedIn
        </a>
    </div>

    <footer class="footer-box" style="margin-top: 5em; padding: 1.5em 2em; border-radius: 8px;">
        <p>&copy; 2026 Axel Sanchez Moreno. All rights reserved.</p>
    </footer>
</main>

</body>
</html>
